<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❄️ BPFAM – Neve & Estratti 💎</title>
  <style>
    body {
      background: radial-gradient(circle at center, #050510 40%, #000 100%);
      color: #eaf6ff;
      font-family: "Poppins", sans-serif;
      margin: 0;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 60px;
      font-size: clamp(26px, 5vw, 50px);
      color: #9ae1ff;
      text-shadow: 0 0 15px #a0c8ff, 0 0 35px #8b6aff, 0 0 60px #00eaff;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #9ae1ff, 0 0 30px #8b6aff; }
      to { text-shadow: 0 0 25px #8b6aff, 0 0 60px #9ae1ff; }
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 40px;
      margin: auto;
      width: 90%;
    }
    video {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 0 15px #8b6aff, 0 0 35px #9ae1ff;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    video:hover {
      transform: scale(1.04);
      box-shadow: 0 0 25px #9ae1ff, 0 0 50px #8b6aff;
    }
    footer {
      font-size: 14px;
      margin: 40px 0 20px;
      color: #b0c4de;
      text-shadow: 0 0 10px #8b6aff;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 2px solid #8b6aff;
      border-radius: 10px;
      text-shadow: 0 0 8px #8b6aff;
      box-shadow: 0 0 10px #8b6aff, 0 0 30px #9ae1ff;
      transition: 0.3s;
    }
    .back-btn:hover {
      background: linear-gradient(90deg, #8b6aff, #9ae1ff);
      color: #000;
      box-shadow: 0 0 25px #9ae1ff, 0 0 60px #8b6aff;
    }
  </style>
</head>
<body>
  <h1>❄️ BPFAM – NEVE & ESTRATTI 💎</h1>

  <a href="https://bpfam.github.io/Video-bpfam/" class="back-btn">⬅️ Torna al Menu</a>

  <div class="video-grid" id="videos"></div>

  <footer>Serietà · Qualità · Rispetto — BPFAM Official Network 💎</footer>

  <script>
    async function loadVideos() {
      const response = await fetch(".");
      const text = await response.text();
      const parser = new DOMParser();
      const htmlDoc = parser.parseFromString(text, "text/html");
      const links = Array.from(htmlDoc.querySelectorAll("a"))
        .map(a => a.href)
        .filter(h => h.endsWith(".mp4"));
      const grid = document.getElementById("videos");
      links.forEach(link => {
        const video = document.createElement("video");
        video.src = link;
        video.controls = true;
        grid.appendChild(video);
      });
    }
    loadVideos();
  </script>
</body>
</html>
