<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ Recensioni BPFAM</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial;
    text-align: center;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 90%;
    margin: 40px auto;
  }

  video, img {
    width: 100%;
    border-radius: 12px;
    border: 2px solid #00eaff;
    box-shadow: 0 0 15px #00eaff;
  }
</style>
</head>
<body>

<h1>⭐ RECENSIONI UFFICIALI BPFAM</h1>
<p>Carica un video/immagine nella cartella <b>recensioni/</b> su GitHub e appare qui automaticamente.</p>

<div class="grid" id="contenitore"></div>

<script>
const owner = "bpfam";
const repo = "Video-bpfam";
const path = "recensioni";

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
  .then(r => r.json())
  .then(files => {
    const box = document.getElementById("contenitore");

    files.forEach(file => {
      let ext = file.name.split('.').pop().toLowerCase();

      // VIDEO
      if(["mp4","mov","webm"].includes(ext)) {
        box.innerHTML += `
          <video controls>
            <source src="${file.download_url}">
          </video>`;
      }

      // FOTO
      if(["jpg","jpeg","png","gif","webp"].includes(ext)) {
        box.innerHTML += `
          <img src="${file.download_url}">
        `;
      }
    });
  });
</script>

</body>
</html>
