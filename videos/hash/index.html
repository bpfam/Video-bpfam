<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPFAM — VETRINA</title>

<style>
:root{
  --gold:#d4af37;
  --bg:#0b0d10;
  --card:#141821;
  --txt:#eaeaea;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#06080c,#0b0d10);
  color:var(--txt);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

/* HEADER */
header{
  position:sticky; top:0; z-index:10;
  padding:14px;
  display:flex; align-items:center; gap:12px;
  background:rgba(10,12,16,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.back{
  text-decoration:none;
  padding:.45rem .9rem;
  border-radius:999px;
  border:1px solid var(--gold);
  color:var(--gold);
  font-size:13px;
}
.title{
  font-weight:900;
  letter-spacing:.18em;
  font-size:14px;
}

/* FILTRI */
.filters{
  display:flex; gap:10px;
  padding:12px;
}
.filters button{
  flex:1;
  background:#10131a;
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  padding:10px;
  border-radius:999px;
  font-weight:700;
}
.filters button.active{
  background:var(--gold);
  color:#000;
}

/* GRID */
.wrap{ padding:14px; }
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.card video,
.card img{
  width:100%;
  border-radius:14px;
  display:block;
  background:#000;
}
.name{
  margin-top:8px;
  font-size:12px;
  text-align:center;
  opacity:.85;
}

/* FOOTER */
footer{
  text-align:center;
  padding:26px 12px;
  font-size:11px;
  opacity:.6;
}
</style>
</head>

<body>

<header>
  <a class="back" href="../../index.html">⬅ Home</a>
  <div class="title">BPFAM — VETRINA</div>
</header>

<div class="filters">
  <button class="active" data-filter="all">TUTTO</button>
  <button data-filter="video">VIDEO</button>
  <button data-filter="photo">FOTO</button>
</div>

<div class="wrap">
  <div id="grid" class="grid"></div>
</div>

<footer>© BPFAM • Premium Network</footer>

<script>
(async ()=>{
  const owner="bpfam";
  const repo="Video-bpfam";
  const path="videos/hash";
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  const grid=document.getElementById("grid");
  const btns=document.querySelectorAll(".filters button");

  let items=[];

  function render(type){
    grid.innerHTML="";
    items.filter(i=>type==="all"||i.kind===type)
      .forEach(i=>grid.appendChild(i.el));
  }

  btns.forEach(b=>{
    b.onclick=()=>{
      btns.forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      render(b.dataset.filter);
    }
  });

  const res=await fetch(api);
  const files=await res.json();

  files.filter(f=>f.type==="file"&&!f.name.match(/index\.html|\.gitkeep/i))
    .forEach(f=>{
      const ext=f.name.split(".").pop().toLowerCase();
      let kind=null, media=null;

      if(["mp4","mov","webm","m4v"].includes(ext)){
        kind="video";
        media=document.createElement("video");
        media.controls=true;
        media.playsInline=true;
        media.src=f.name;
      }
      if(["jpg","jpeg","png","webp"].includes(ext)){
        kind="photo";
        media=document.createElement("img");
        media.src=f.name;
      }
      if(!media) return;

      const card=document.createElement("div");
      card.className="card";

      const name=document.createElement("div");
      name.className="name";
      name.textContent=f.name;

      card.appendChild(media);
      card.appendChild(name);

      items.push({kind,el:card});
    });

  render("all");
})();
</script>

</body>
</html>
