<script>
(async () => {
  const owner = "bpfam";
  const repo  = "Video-bpfam";
  const path  = "videos/weed";
  const api   = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  // griglia: ricorda la scelta colonne
  const grid = document.getElementById("grid");
  const saved = localStorage.getItem("bpfam_cols") || "2";
  grid.setAttribute("data-cols", saved);

  // FAB
  const fab = document.getElementById("fab");
  const toggle = document.getElementById("fabToggle");
  const menu = document.getElementById("fabMenu");
  const btns = menu.querySelectorAll(".fab-btn");
  function setActive(c){ grid.setAttribute("data-cols", c); localStorage.setItem("bpfam_cols", c);
    btns.forEach(b => b.classList.toggle("active", b.dataset.c === c)); }
  setActive(saved);
  toggle.addEventListener("click", ()=> fab.classList.toggle("open"));
  document.addEventListener("click", (e)=>{ if(!fab.contains(e.target)) fab.classList.remove("open"); });
  btns.forEach(b=> b.addEventListener("click", ()=>{ setActive(b.dataset.c); fab.classList.remove("open"); }));

  // helper: crea URL sicuro per QUALSIASI nome file
  function safeUrl(fileName){
    // pagina è /Video-bpfam/videos/weed/index.html -> cartella corrente:
    const base = location.pathname.replace(/\/[^\/]*$/, "/");
    return base + encodeURIComponent(fileName).replace(/%2F/gi, "/");
  }

  // estensioni supportate (puoi aggiungere)
  const exts = /\.(mp4|m4v|mov|webm)$/i;

  try{
    const res = await fetch(api, { headers:{ "Accept":"application/vnd.github+json" }});
    const data = await res.json();

    const files = (Array.isArray(data)?data:[])
      .filter(f => f.type === "file" && exts.test(f.name))
      // ordinamento "umano" (A-Å, numeri 1<2<10)
      .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}));

    if(!files.length){
      const empty = document.getElementById("empty");
      empty.style.display = "block";
      empty.textContent = "Nessun video trovato nella cartella.";
      return;
    }

    for(const f of files){
      const card = document.createElement("div");
      card.className = "card";

      const v = document.createElement("video");
      v.controls = true;
      v.playsInline = true;
      v.preload = "metadata";
      v.src = safeUrl(f.name);          // ✅ supporta spazi, emoji, accenti, ecc.
      // fallback: se per qualche motivo l'URL relativo fallisce, prova raw
      v.addEventListener("error", ()=>{
        v.src = `https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/main/${path}/${encodeURIComponent(f.name)}`;
      }, {once:true});

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = f.name;        // mostra il nome esatto che carichi

      card.appendChild(v);
      card.appendChild(name);
      grid.appendChild(card);
    }
  }catch(e){
    console.error(e);
    const empty = document.getElementById("empty");
    empty.style.display = "block";
    empty.textContent = "Errore nel caricare i file.";
  }
})();
</script>
