<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPFAM — Neve & Estratti</title>
<style>
  :root{ --neon1:#9ae1ff; --neon2:#8b6aff; --gap:12px; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#000; color:#e9eaff; font-family:system-ui, Arial, sans-serif; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    padding:12px; background:radial-gradient(circle at center, #05060a 40%, #000 100%);
    border-bottom:1px solid rgba(155,150,255,.18);
  }
  .left{ display:flex; gap:10px; align-items:center; min-width:0; }
  .back{
    text-decoration:none; padding:.5rem .9rem; border:1px solid var(--neon2); border-radius:999px;
    color:var(--neon2); box-shadow:0 0 12px var(--neon2); transition:all .2s ease; white-space:nowrap;
  }
  .back:hover{ background:var(--neon2); color:#000; }
  .title{
    margin:0; font-size:1rem; line-height:1; display:flex; align-items:center; gap:8px;
    color:var(--neon1); text-shadow:0 0 10px var(--neon1), 0 0 26px var(--neon2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .wrap{ max-width:1200px; margin:0 auto; padding:16px; }
  .grid{ display:grid; gap:var(--gap); }
  .grid[data-cols="4"]{ grid-template-columns:repeat(4,1fr); }
  .grid[data-cols="3"]{ grid-template-columns:repeat(3,1fr); }
  .grid[data-cols="2"]{ grid-template-columns:repeat(2,1fr); }
  .grid[data-cols="1"]{ grid-template-columns:repeat(1,1fr); }

  .card{
    padding:10px; border-radius:14px; background:#0b0f18; border:1px solid rgba(155,150,255,.25);
    box-shadow:
      0 0 0 1px rgba(155,150,255,.35) inset,
      0 0 22px rgba(154,225,255,.25),
      0 0 44px rgba(139,106,255,.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:scale(1.03); box-shadow:0 0 28px rgba(154,225,255,.45); }

  video{
    width:100%; aspect-ratio:9/16; object-fit:cover; display:block; border-radius:12px; background:#000;
  }
  .name{ margin:.45rem 0 0; text-align:center; font-size:.7rem; color:#c9d0ff; word-break:break-word; }

  .empty{ color:#c9d0ff; text-align:center; padding:40px 12px; }
  footer{ text-align:center; color:#c9d0ff; opacity:.8; padding:26px 12px; }

  .fab{ position:fixed; right:14px; bottom:18px; z-index:20; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .fab-toggle{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--neon2); background:#000; color:var(--neon2);
    box-shadow:0 0 12px var(--neon2), inset 0 0 10px rgba(139,106,255,.25);
    font-size:1.2rem; cursor:pointer; transition:transform .15s ease, box-shadow .2s ease;
  }
  .fab-toggle:hover{ transform:scale(1.05); box-shadow:0 0 18px var(--neon2); }
  .fab-menu{
    display:none; flex-direction:column; gap:6px; padding:8px;
    background:#070912; border:1px solid rgba(155,150,255,.25); border-radius:12px;
    box-shadow:0 0 24px rgba(154,225,255,.35);
  }
  .fab.open .fab-menu{ display:flex; }
  .fab-btn{
    min-width:44px; padding:.35rem .65rem; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--neon1); border:1px solid var(--neon1); font-weight:700;
    box-shadow:0 0 8px var(--neon1);
  }
  .fab-btn.active{ background:var(--neon1); color:#000; }
</style>
</head>
<body>
  <header>
    <div class="left">
      <a class="back" href="/Video-bpfam/">⬅️ Torna al Menù</a>
      <h1 class="title">❄️ BPFAM — NEVE & ESTRATTI 💎</h1>
    </div>
  </header>

  <div class="wrap">
    <div id="grid" class="grid" data-cols="2"></div>
    <div id="empty" class="empty" style="display:none">Nessun video trovato.</div>
  </div>

  <footer>Serietà · Qualità · Rispetto — BPFAM Official Network 💎</footer>

  <!-- FAB -->
  <div class="fab" id="fab">
    <div class="fab-menu" id="fabMenu">
      <button class="fab-btn" data-c="1">1</button>
      <button class="fab-btn" data-c="2">2</button>
      <button class="fab-btn" data-c="3">3</button>
      <button class="fab-btn" data-c="4">4</button>
    </div>
    <button class="fab-toggle" id="fabToggle">⧉</button>
  </div>

<script>
(async () => {
  // griglia: ricorda l’ultima scelta
  const grid = document.getElementById("grid");
  const saved = localStorage.getItem("bpfam_cols") || "2";
  grid.setAttribute("data-cols", saved);

  const fab = document.getElementById("fab");
  const toggle = document.getElementById("fabToggle");
  const menu = document.getElementById("fabMenu");
  const btns = menu.querySelectorAll(".fab-btn");
  function setActive(c){
    grid.setAttribute("data-cols", c);
    localStorage.setItem("bpfam_cols", c);
    btns.forEach(b => b.classList.toggle("active", b.dataset.c === c));
  }
  setActive(saved);
  toggle.addEventListener("click", ()=> fab.classList.toggle("open"));
  document.addEventListener("click", (e)=>{ if(!fab.contains(e.target)) fab.classList.remove("open"); });
  btns.forEach(b=> b.addEventListener("click", ()=>{ setActive(b.dataset.c); fab.classList.remove("open"); }));

  // --- Loader robusto (accetta anche file senza estensione) ---
  const owner = "bpfam";
  const repo  = "Video-bpfam";
  const path  = "videos/neve-estratti";
  const api   = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  const VIDEO_RE = /\.(mp4|mov|m4v|webm|mkv|avi)$/i;
  function guessMime(name){
    const ext = (name.split('.').pop()||'').toLowerCase();
    return ({
      mp4:'video/mp4',
      mov:'video/quicktime',
      m4v:'video/x-m4v',
      webm:'video/webm',
      mkv:'video/x-matroska',
      avi:'video/x-msvideo'
    })[ext] || 'video/mp4';
  }

  try{
    const res = await fetch(api, { headers:{ "Accept":"application/vnd.github+json" }});
    const data = await res.json();
    const files = (Array.isArray(data)?data:[])
      .filter(f => f.type === "file" && !/^(index\.html|\.gitkeep)$/i.test(f.name))
      .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}));

    if(!files.length){
      document.getElementById("empty").style.display = "block";
      return;
    }

    for(const f of files){
      const encoded = encodeURIComponent(f.name);
      const srcRel  = `./${encoded}`;
      const type    = guessMime(f.name);

      const card = document.createElement("div");
      card.className = "card";

      const v = document.createElement("video");
      v.controls = true;
      v.playsInline = true;
      v.preload = "metadata";

      const s = document.createElement("source");
      s.src = srcRel;
      s.type = type;
      v.appendChild(s);

      // se fallisce il playback, togli la card
      v.addEventListener("error", ()=> card.remove(), {once:true});

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = f.name;

      card.appendChild(v);
      card.appendChild(name);
      grid.appendChild(card);
    }
  }catch(e){
    console.error(e);
    const emp = document.getElementById("empty");
    emp.style.display = "block";
    emp.textContent = "Errore nel caricare i file.";
  }
})();
</script>
</body>
</html>
