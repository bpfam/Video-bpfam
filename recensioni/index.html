<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPFAM RECENSIONI</title>

<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin-top: 80px;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #00eaff;
    text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff;
  }

  /* --- Pulsante Back fisso --- */
  .back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 10px 20px;
    border-radius: 10px;
    background: transparent;
    text-decoration: none;
    color: #00eaff;
    border: 2px solid #00eaff;
    font-weight: bold;
    font-size: 16px;
    text-shadow: 0 0 8px #00eaff;
    box-shadow: 0 0 15px #00eaff;
    transition: 0.25s;
    z-index: 99;
  }

  .back-btn:hover {
    background: #00eaff;
    color: #000;
    box-shadow: 0 0 30px #00eaff;
  }

  /* --- Animazioni immagini/video --- */
  .fade {
    opacity: 0;
    transform: scale(0.98);
    animation: fadeIn 0.6s ease forwards;
  }
  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 35px;
    width: 92%;
    margin: 40px auto 80px;
  }

  video, img {
    width: 100%;
    border-radius: 16px;
    border: 2px solid #00eaff;
    box-shadow: 0 0 20px #00eaff;
  }
</style>
</head>

<body>

<a class="back-btn" href="https://bpfam.github.io">🔙 Torna indietro</a>

<h1>⭐ BPFAM RECENSIONI ⭐</h1>

<div class="grid" id="contenitore"></div>

<script>
const owner = "bpfam";
const repo = "Video-bpfam";
const path = "recensioni";

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
  .then(r => r.json())
  .then(files => {
    const box = document.getElementById("contenitore");

    files.reverse().forEach(file => {
      let ext = file.name.split('.').pop().toLowerCase();

      if(["mp4","mov","webm"].includes(ext)) {
        box.innerHTML += `
          <video class="fade" controls preload="metadata">
            <source src="${file.download_url}">
          </video>`;
      }

      if(["jpg","jpeg","png","gif","webp"].includes(ext)) {
        box.innerHTML += `
          <img class="fade" src="${file.download_url}">
        `;
      }
    });
  });
</script>

</body>
</html>
