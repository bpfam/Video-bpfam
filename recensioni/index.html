<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPFAM RECENSIONI</title>
<style>
  :root { --neon:#00eaff; --gap:12px; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#e9feff; font-family:system-ui, Arial, sans-serif; }

  /* HEADER */
  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    padding:12px; background:radial-gradient(circle at center, #030b0c 40%, #000 100%);
    border-bottom:1px solid rgba(0,234,255,.18);
  }
  .left{ display:flex; gap:10px; align-items:center; min-width:0; }
  .back{
    text-decoration:none; padding:.5rem .9rem; border:1px solid var(--neon);
    border-radius:999px; color:var(--neon);
    box-shadow:0 0 12px var(--neon);
    transition:all .2s ease; white-space:nowrap;
  }
  .back:hover{ background:var(--neon); color:#000; }

  /* TITOLO CON GLOW POTENZIATO */
  .title{
    margin:0; font-size:1rem; line-height:1;
    display:flex; align-items:center; gap:8px;
    color:var(--neon);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow {
    from {
      text-shadow:0 0 10px var(--neon),
                  0 0 20px var(--neon);
    }
    to {
      text-shadow:0 0 20px var(--neon),
                  0 0 40px var(--neon),
                  0 0 70px var(--neon);
    }
  }

  .wrap{ max-width:1200px; margin:0 auto; padding:16px; }

  /* GRID */
  .grid{ display:grid; gap:var(--gap); }
  .grid[data-cols="4"]{ grid-template-columns:repeat(4,1fr); }
  .grid[data-cols="3"]{ grid-template-columns:repeat(3,1fr); }
  .grid[data-cols="2"]{ grid-template-columns:repeat(2,1fr); }
  .grid[data-cols="1"]{ grid-template-columns:repeat(1,1fr); }

  /* CARD + FADE-IN */
  .card{
    padding:10px;
    border-radius:14px;
    background:#020202;
    border:1px solid rgba(0,234,255,.2);
    box-shadow:0 0 0 1px rgba(0,234,255,.25) inset,
               0 0 22px rgba(0,234,255,.25),
               0 0 44px rgba(0,234,255,.15);
    transition:transform .18s ease, box-shadow .18s ease,
               opacity .35s ease, transform .35s ease;
    opacity:0;
    transform:translateY(10px);
  }
  .card.show{
    opacity:1;
    transform:translateY(0);
  }
  .card:hover{
    transform:scale(1.03);
    box-shadow:0 0 28px rgba(0,234,255,.45);
  }

  video, img{
    width:100%;
    aspect-ratio:9/16;
    object-fit:cover;
    display:block;
    border-radius:12px;
    background:#000;
  }

  .name{
    margin:.45rem 0 0;
    text-align:center;
    font-size:.7rem;
    color:#9af6ff;
    word-break:break-word;
  }

  footer{
    text-align:center;
    color:#9af6ff;
    opacity:.8;
    padding:26px 12px;
  }

  /* FAB 1–2–3–4 COLONNE */
  .fab{
    position:fixed;
    right:14px;
    bottom:18px;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .fab-toggle{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--neon);
    background:#000; color:var(--neon);
    box-shadow:0 0 12px var(--neon),
               inset 0 0 10px rgba(0,234,255,.2);
    font-size:1.2rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .fab-toggle:hover{
    transform:scale(1.05);
    box-shadow:0 0 18px var(--neon);
  }
  .fab-menu{
    display:none;
    flex-direction:column;
    gap:6px;
    padding:8px;
    background:#020202;
    border:1px solid rgba(0,234,255,.25);
    border-radius:12px;
    box-shadow:0 0 24px rgba(0,234,255,.35);
  }
  .fab.open .fab-menu{ display:flex; }

  .fab-btn{
    min-width:44px;
    padding:.35rem .65rem;
    border-radius:999px;
    cursor:pointer;
    background:transparent;
    color:var(--neon);
    border:1px solid var(--neon);
    font-weight:700;
    box-shadow:0 0 8px var(--neon);
    font-size:.8rem;
  }
  .fab-btn.active{
    background:var(--neon);
    color:#000;
  }

  /* FULLSCREEN VIEWER FOTO */
  .viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 20px;
    touch-action: none; /* per gestire pinch/swipe */
  }
  .viewer.show {
    display: flex;
  }
  .viewer-img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    box-shadow: 0 0 35px var(--neon);
    transform-origin: center center;
    transition: transform 0.1s linear;
  }
  .viewer-close {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 26px;
    color: #fff;
    background: rgba(0,0,0,.6);
    border-radius: 999px;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,.4);
    cursor: pointer;
  }
  .viewer-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color:#fff;
    font-size:34px;
    background:rgba(0,0,0,.45);
    border-radius:999px;
    padding:8px 14px;
    border:1px solid rgba(255,255,255,.4);
    cursor:pointer;
    user-select:none;
  }
  .viewer-nav.prev { left:12px; }
  .viewer-nav.next { right:12px; }
</style>
</head>

<body>

  <header>
    <div class="left">
      <a class="back" href="/Video-bpfam/">⬅️ Torna al Menù</a>
      <h1 class="title">⭐ BPFAM RECENSIONI ⭐</h1>
    </div>
  </header>

  <div class="wrap">
    <div id="grid" class="grid" data-cols="2"></div>
  </div>

  <footer>💎 Serietà, Qualità e Rispetto — BPFAM</footer>

  <!-- FAB -->
  <div class="fab" id="fab">
    <div class="fab-menu" id="fabMenu" aria-label="Numero colonne">
      <button class="fab-btn" data-c="1">1</button>
      <button class="fab-btn" data-c="2">2</button>
      <button class="fab-btn" data-c="3">3</button>
      <button class="fab-btn" data-c="4">4</button>
    </div>
    <button class="fab-toggle" id="fabToggle" aria-label="Vista">⧉</button>
  </div>

  <!-- FULLSCREEN VIEWER FOTO -->
  <div class="viewer" id="viewer">
    <span class="viewer-close" id="viewerClose">✕</span>
    <span class="viewer-nav prev" id="viewerPrev">❮</span>
    <img id="viewerImg" class="viewer-img" src="">
    <span class="viewer-nav next" id="viewerNext">❯</span>
  </div>

<script>
(async () => {
  const owner = "bpfam";
  const repo  = "Video-bpfam";
  const path  = "recensioni";

  const api  = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const grid = document.getElementById("grid");

  // colonne salvate solo per pagina recensioni
  const saved = localStorage.getItem("bpfam_cols_rec") || "2";
  grid.setAttribute("data-cols", saved);

  const fab    = document.getElementById("fab");
  const toggle = document.getElementById("fabToggle");
  const menu   = document.getElementById("fabMenu");
  const btns   = menu.querySelectorAll(".fab-btn");

  function setActive(c){
    grid.setAttribute("data-cols", c);
    localStorage.setItem("bpfam_cols_rec", c);
    btns.forEach(b => b.classList.toggle("active", b.dataset.c === c));
  }

  setActive(saved);

  toggle.addEventListener("click", () => fab.classList.toggle("open"));
  document.addEventListener("click", (e) => {
    if (!fab.contains(e.target)) fab.classList.remove("open");
  });
  btns.forEach(b => b.addEventListener("click", () => {
    setActive(b.dataset.c);
    fab.classList.remove("open");
  }));

  const VIDEO_RE = /\.(mp4|mov|webm|m4v|mkv|avi)$/i;
  const IMG_RE   = /\.(jpe?g|png|gif|webp)$/i;

  let imageList = [];   // {src}
  let currentIndex = 0;

  try {
    const res   = await fetch(api);
    const files = await res.json();

    for (const f of files) {
      if (!f.download_url) continue;

      const isVideo = VIDEO_RE.test(f.name);
      const isImage = IMG_RE.test(f.name);
      if (!isVideo && !isImage) continue;

      const card = document.createElement("div");
      card.className = "card";

      if (isVideo) {
        const v = document.createElement("video");
        v.controls = true;
        v.playsInline = true;
        v.preload = "metadata";
        v.src = f.download_url;
        card.appendChild(v);
      } else if (isImage) {
        const img = document.createElement("img");
        const idx = imageList.length;
        img.src = f.download_url;
        img.alt = f.name;
        img.dataset.index = idx;
        imageList.push({ src: f.download_url });
        card.appendChild(img);
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = f.name;
      card.appendChild(name);

      grid.appendChild(card);

      // FADE-IN dopo inserimento
      requestAnimationFrame(() => {
        card.classList.add("show");
      });
    }
  } catch (e) {
    console.error(e);
  }

  /* FULLSCREEN IMMAGINI + SWIPE + PINCH ZOOM */
  const viewer    = document.getElementById("viewer");
  const viewerImg = document.getElementById("viewerImg");
  const viewerClose = document.getElementById("viewerClose");
  const viewerPrev  = document.getElementById("viewerPrev");
  const viewerNext  = document.getElementById("viewerNext");

  let scale = 1;
  let initialPinchDistance = null;
  let initialScale = 1;
  let startX = null;
  let swiping = false;

  function openViewer(index) {
    if (!imageList.length) return;
    currentIndex = ((index % imageList.length) + imageList.length) % imageList.length;
    viewerImg.src = imageList[currentIndex].src;
    scale = 1;
    viewerImg.style.transform = "scale(1)";
    viewer.classList.add("show");
  }

  function closeViewer() {
    viewer.classList.remove("show");
    viewerImg.src = "";
    scale = 1;
    viewerImg.style.transform = "scale(1)";
  }

  function showNext() {
    openViewer(currentIndex + 1);
  }

  function showPrev() {
    openViewer(currentIndex - 1);
  }

  grid.addEventListener("click", e => {
    const img = e.target.closest("img");
    if (!img) return;
    const idx = parseInt(img.dataset.index, 10);
    if (!isNaN(idx)) {
      openViewer(idx);
    }
  });

  viewerClose.addEventListener("click", closeViewer);
  viewerPrev.addEventListener("click", e => { e.stopPropagation(); showPrev(); });
  viewerNext.addEventListener("click", e => { e.stopPropagation(); showNext(); });

  // chiudi se tocchi sfondo (non quando tocchi l'immagine)
  viewer.addEventListener("click", e => {
    if (e.target === viewer) {
      closeViewer();
    }
  });

  // TOUCH HANDLING (SWIPE + PINCH)
  viewer.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      swiping = true;
    } else if (e.touches.length === 2) {
      swiping = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialPinchDistance = Math.hypot(dx, dy);
      initialScale = scale;
    }
  }, { passive: false });

  viewer.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && initialPinchDistance) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      let newScale = initialScale * (dist / initialPinchDistance);
      if (newScale < 1) newScale = 1;
      if (newScale > 3) newScale = 3;
      scale = newScale;
      viewerImg.style.transform = `scale(${scale})`;
    }
  }, { passive: false });

  viewer.addEventListener("touchend", e => {
    if (e.touches.length === 0) {
      // SWIPE solo se non siamo in zoom
      if (swiping && scale === 1 && startX !== null) {
        const endX = (e.changedTouches && e.changedTouches[0]?.clientX) || startX;
        const deltaX = endX - startX;
        const threshold = 50;
        if (deltaX > threshold) {
          showPrev();
        } else if (deltaX < -threshold) {
          showNext();
        }
      }
      initialPinchDistance = null;
      startX = null;
      swiping = false;
    }
  });

  /* ANTI-DOWNLOAD BASE */
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("dragstart", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && ["s","p","u"].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
})();
</script>

</body>
</html>
