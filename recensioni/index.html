<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPFAM RECENSIONI</title>
<style>
  :root { --neon:#00eaff; --gap:12px; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#e9feff; font-family:system-ui, Arial, sans-serif; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
    background:radial-gradient(circle at center, #030b0c 40%, #000 100%);
    border-bottom:1px solid rgba(0,234,255,.18);
  }
  .title{
    font-size:1rem; color:var(--neon);
    animation: glow 2s infinite alternate;
  }
  @keyframes glow { from{ text-shadow:0 0 10px var(--neon)} to{ text-shadow:0 0 35px var(--neon) } }

  .wrap{ max-width:1200px; margin:0 auto; padding:16px; }

  .grid{ display:grid; gap:var(--gap); }
  .grid[data-cols="2"]{ grid-template-columns:repeat(2,1fr); }
  .grid[data-cols="3"]{ grid-template-columns:repeat(3,1fr); }
  .grid[data-cols="4"]{ grid-template-columns:repeat(4,1fr); }
  .grid[data-cols="1"]{ grid-template-columns:repeat(1,1fr); }

  .card{
    padding:10px; border-radius:14px;
    background:#020202;
    opacity:0; transform:translateY(14px);
    transition:.35s;
    border:1px solid rgba(0,234,255,.25);
    box-shadow:0 0 22px rgba(0,234,255,.2);
  }
  .card.show{ opacity:1; transform:translateY(0); }

  img, video{
    width:100%; border-radius:12px;
    object-fit:cover; aspect-ratio:9/16;
  }
  .name{
    text-align:center; font-size:.7rem; color:#9af6ff;
    margin-top:6px; word-break:break-word;
  }

  footer{ text-align:center; color:#9af6ff; padding:26px; opacity:.8; }

  .fab{
    position:fixed; right:16px; bottom:20px; z-index:20;
    display:flex; flex-direction:column; gap:10px;
  }
  .fab-toggle{
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--neon); background:#000; color:var(--neon);
    box-shadow:0 0 12px var(--neon);
    font-size:1.3rem; cursor:pointer;
  }
  .fab-menu{
    display:none; flex-direction:column; gap:6px;
    background:#020202; padding:8px;
    border-radius:12px; border:1px solid rgba(0,234,255,.25);
  }
  .fab.open .fab-menu{ display:flex; }
  .fab-btn{
    padding:.35rem .7rem; border-radius:999px;
    background:#000; border:1px solid var(--neon);
    color:var(--neon); cursor:pointer;
  }
  .fab-btn.active{ background:var(--neon); color:#000; }

  /* VIEWER */
  .viewer{
    position:fixed; inset:0;
    display:none; justify-content:center; align-items:center;
    background:rgba(0,0,0,.92);
    z-index:999; touch-action:none;
    padding:20px;
  }
  .viewer.show{ display:flex; }

  .viewer-img{
    max-width:100%; max-height:100%;
    border-radius:14px;
    transition:transform .1s linear;
    box-shadow:0 0 40px var(--neon);
  }

  .viewer-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    font-size:46px; font-weight:900;
    background:rgba(0,0,0,.6);
    border-radius:50%;
    padding:12px 20px;
    border:2px solid var(--neon);
    color:var(--neon);
    cursor:pointer;
    user-select:none;
  }
  .viewer-nav.prev{ left:16px; }
  .viewer-nav.next{ right:16px; }

</style>
</head>

<body>

<header><h1 class="title">⭐ BPFAM RECENSIONI ⭐</h1></header>

<div class="wrap">
  <div id="grid" class="grid" data-cols="2"></div>
</div>

<footer>Serietà, Qualità e Rispetto — BPFAM</footer>

<div class="fab" id="fab">
  <div class="fab-menu" id="fabMenu">
    <button class="fab-btn" data-c="1">1</button>
    <button class="fab-btn" data-c="2">2</button>
    <button class="fab-btn" data-c="3">3</button>
    <button class="fab-btn" data-c="4">4</button>
  </div>
  <button class="fab-toggle" id="fabToggle">⧉</button>
</div>

<div class="viewer" id="viewer">
  <span class="viewer-nav prev" id="viewerPrev">❮</span>
  <img id="viewerImg" class="viewer-img">
  <span class="viewer-nav next" id="viewerNext">❯</span>
</div>

<script>
(async()=>{
  const grid=document.getElementById("grid");
  const api="https://api.github.com/repos/bpfam/Video-bpfam/contents/recensioni";
  const saved=localStorage.getItem("bpfam_cols_rec")||"2";
  grid.dataset.cols=saved;

  const fab=document.getElementById("fab");
  const toggle=document.getElementById("fabToggle");
  const menu=document.getElementById("fabMenu");
  toggle.onclick=()=>fab.classList.toggle("open");

  menu.onclick=e=>{
    if(e.target.dataset.c){
      grid.dataset.cols=e.target.dataset.c;
      localStorage.setItem("bpfam_cols_rec",e.target.dataset.c);
      fab.classList.remove("open");
    }
  };

  const res=await fetch(api);
  const files=await res.json();
  const images=[];
  files.forEach((f,i)=>{
    if(!f.download_url)return;
    const card=document.createElement("div");
    card.className="card";
    let media;
    if(/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name)){
      media=document.createElement("img");
      media.dataset.i=images.length;
      media.src=f.download_url;
      images.push(f.download_url);
    }else if(/\.(mp4|mov|webm)$/i.test(f.name)){
      media=document.createElement("video");
      media.controls=true;
      media.src=f.download_url;
    }
    if(!media)return;
    card.appendChild(media);
    card.innerHTML+=`<div class="name">${f.name}</div>`;
    grid.appendChild(card);
    requestAnimationFrame(()=>card.classList.add("show"));
  });

  const viewer=document.getElementById("viewer");
  const viewerImg=document.getElementById("viewerImg");
  const prev=document.getElementById("viewerPrev");
  const next=document.getElementById("viewerNext");
  let current=0,scale=1,startX=null,startY=null,pinch=null;

  function open(i){
    current=(i+images.length)%images.length;
    viewerImg.src=images[current];
    viewer.classList.add("show");
    scale=1; viewerImg.style.transform="scale(1)";
  }
  function close(){ viewer.classList.remove("show"); }

  grid.onclick=e=>{
    const img=e.target.closest("img"); if(!img)return;
    open(parseInt(img.dataset.i,10));
  };
  prev.onclick=e=>{e.stopPropagation();open(current-1)};
  next.onclick=e=>{e.stopPropagation();open(current+1)};

  viewer.onclick=e=>{ if(e.target===viewer) close(); };

  viewer.ontouchstart=e=>{
    if(e.touches.length===1){ startX=e.touches[0].clientX; startY=e.touches[0].clientY; }
    else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      pinch=Math.hypot(dx,dy);
    }
  };
  viewer.ontouchmove=e=>{
    if(e.touches.length===2&&pinch){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      scale=Math.min(3,Math.max(1,Math.hypot(dx,dy)/pinch));
      viewerImg.style.transform=`scale(${scale})`;
    }
  };
  viewer.ontouchend=e=>{
    const touch=e.changedTouches[0];
    const dx=touch.clientX-startX;
    const dy=touch.clientY-startY;
    if(scale===1){
      if(dx>60)open(current-1);
      if(dx<-60)open(current+1);
      if(dy>80)close();
    }
    startX=null; startY=null; pinch=null;
  };

  document.oncontextmenu=e=>e.preventDefault();
})();
</script>

</body>
</html>
