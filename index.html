<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎥 BPFAM-VIDEO-UFFICIALI 💎</title>
  <style>
    :root{
      --c-hash:#00eaff;             /* azzurro */
      --c-weed:#00ffcc;             /* verde acqua */
      --c-rec-1:#ffeaa0;            /* oro soft */
      --c-rec-2:#ffc149;
      --c-neve-1:#9ae1ff;           /* ghiaccio */
      --c-neve-2:#8b6aff;           /* blu-violetto */
    }

    body {
      background: radial-gradient(circle at center, #020202 40%, #000 100%);
      color: #fff;
      font-family: "Poppins", sans-serif;
      margin: 0;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 70px;
      font-size: clamp(28px, 6vw, 56px);
      color: var(--c-hash);
      text-shadow: 0 0 10px var(--c-hash), 0 0 30px var(--c-hash), 0 0 60px var(--c-hash);
      letter-spacing: 2px;
      animation: glow 2.5s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px var(--c-hash), 0 0 10px var(--c-hash), 0 0 15px var(--c-hash); }
      to   { text-shadow: 0 0 20px var(--c-hash), 0 0 40px var(--c-hash), 0 0 80px var(--c-hash); }
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-top: 50px;
      padding: 0 16px 60px;
    }

    /* base bottone */
    .btn {
      display: inline-block;
      background: transparent;
      border-radius: 15px;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform .25s ease, box-shadow .25s ease, color .25s ease, background .25s ease, border-color .25s ease;
    }
    .btn:hover { transform: scale(1.05); }

    /* varianti colore */
    .btn.hash {
      color: var(--c-hash); border: 2px solid var(--c-hash);
      box-shadow: 0 0 10px var(--c-hash), inset 0 0 10px var(--c-hash);
    }
    .btn.hash:hover {
      background: var(--c-hash); color:#000;
      box-shadow: 0 0 30px var(--c-hash), 0 0 60px var(--c-hash);
    }

    .btn.weed {
      color: var(--c-weed); border: 2px solid var(--c-weed);
      box-shadow: 0 0 10px var(--c-weed), inset 0 0 10px var(--c-weed);
    }
    .btn.weed:hover {
      background: var(--c-weed); color:#000;
      box-shadow: 0 0 30px var(--c-weed), 0 0 60px var(--c-weed);
    }

    .btn.recensioni {
      color: var(--c-rec-2); border: 2px solid var(--c-rec-2);
      box-shadow: 0 0 12px var(--c-rec-2), inset 0 0 10px rgba(255,193,73,.45);
      background:
        linear-gradient(#000,#000) padding-box,
        radial-gradient(60% 120% at 50% 0%, var(--c-rec-1), var(--c-rec-2)) border-box;
    }
    .btn.recensioni:hover {
      background: linear-gradient(180deg, var(--c-rec-1), var(--c-rec-2));
      color:#000;
      box-shadow: 0 0 30px rgba(255,193,73,.9), 0 0 60px rgba(255,193,73,.6);
    }

    .btn.neve {
      color: var(--c-neve-1);
      border: 2px solid var(--c-neve-2);
      box-shadow: 0 0 12px var(--c-neve-2), inset 0 0 12px rgba(155,120,255,.35);
      background:
        linear-gradient(#000,#000) padding-box,
        linear-gradient(135deg, var(--c-neve-1), var(--c-neve-2)) border-box;
    }
    .btn.neve:hover {
      background: linear-gradient(135deg, var(--c-neve-1), var(--c-neve-2));
      color:#000;
      box-shadow: 0 0 30px var(--c-neve-2), 0 0 60px var(--c-neve-1);
    }

    footer {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🎥 BPFAM-VIDEO-UFFICIALI 💎</h1>

  <div class="menu">
    <a class="btn hash" href="/Video-bpfam/videos/hash/">👉 HASH — 🇺🇸 🇲🇦</a>
    <a class="btn weed" href="/Video-bpfam/videos/weed/">👉 WEED — 🇺🇸 🇪🇸 🇳🇱 🇹🇭</a>
    <a class="btn recensioni" href="/Video-bpfam/recensioni/">👉 🌠 RECENSIONI</a>
    <a class="btn neve" href="/Video-bpfam/videos/neve-estratti/">👉 NEVE – ESTRATTI ❄️🇧🇴🇨🇴🇺🇸🍯</a>
  </div>

  <footer>
    💎 Serietà, Qualità e Rispetto — BPFAM Official Network 💎
  </footer>

</body>
</html>
