<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPFAM RECENSIONI</title>
<style>
  :root { --neon:#00eaff; --gap:12px; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#e9feff; font-family:system-ui, Arial, sans-serif; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    padding:12px; background:radial-gradient(circle at center, #030b0c 40%, #000 100%);
    border-bottom:1px solid rgba(0,234,255,.18);
  }
  .back{
    text-decoration:none; padding:.5rem .9rem; border:1px solid var(--neon);
    border-radius:999px; color:var(--neon);
    box-shadow:0 0 12px var(--neon);
    transition:all .2s ease; white-space:nowrap;
  }
  .back:hover{ background:var(--neon); color:#000; }

  .title{
    margin:0; font-size:1rem; line-height:1;
    display:flex; align-items:center; gap:8px;
    color:var(--neon);
    animation: glow 2s infinite alternate;
    white-space:nowrap;
  }
  @keyframes glow {
    from { text-shadow:0 0 10px var(--neon) }
    to { text-shadow:0 0 35px var(--neon),0 0 70px var(--neon) }
  }

  .wrap{ max-width:1200px; margin:0 auto; padding:16px; }

  .grid{ display:grid; gap:var(--gap); }
  .grid[data-cols="2"]{ grid-template-columns:repeat(2,1fr); }
  .grid[data-cols="3"]{ grid-template-columns:repeat(3,1fr); }
  .grid[data-cols="4"]{ grid-template-columns:repeat(4,1fr); }
  .grid[data-cols="1"]{ grid-template-columns:repeat(1,1fr); }

  .card{
    padding:10px; border-radius:14px;
    background:#020202;
    border:1px solid rgba(0,234,255,.2);
    opacity:0; transform:translateY(14px);
    transition:.35s;
    box-shadow:0 0 22px rgba(0,234,255,.2);
  }
  .card.show{ opacity:1; transform:translateY(0); }

  video, img{
    width:100%; display:block;
    border-radius:12px;
    aspect-ratio:9/16;
    object-fit:cover;
  }

  .name{
    text-align:center;
    font-size:.7rem; margin-top:6px;
    color:#9af6ff;
  }

  footer{ text-align:center; color:#9af6ff; padding:26px 12px; opacity:.8; }

  /* FAB */
  .fab{
    position:fixed; right:16px; bottom:20px; z-index:20;
    display:flex; flex-direction:column; gap:10px;
  }
  .fab-toggle{
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--neon); background:#000; color:var(--neon);
    box-shadow:0 0 12px var(--neon);
    cursor:pointer; font-size:1.3rem;
  }
  .fab-menu{
    display:none; flex-direction:column; gap:6px;
    background:#020202; padding:8px;
    border-radius:12px; border:1px solid rgba(0,234,255,.25);
  }
  .fab.open .fab-menu{ display:flex; }
  .fab-btn{
    padding:.4rem .7rem; border-radius:999px;
    border:1px solid var(--neon); color:var(--neon);
    box-shadow:0 0 8px var(--neon); cursor:pointer;
    background:#000; font-weight:700;
  }
  .fab-btn.active{ background:var(--neon); color:#000; }

  /* FULLSCREEN VIEWER */
  .viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 20px;
    touch-action:none;
  }
  .viewer.show { display:flex; }
  .viewer-img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    box-shadow: 0 0 40px var(--neon);
    transition: transform .1s linear;
  }

  /* Frecce */
  .viewer-nav {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    font-size: 46px; font-weight:900;
    background:rgba(0,0,0,.6);
    border-radius:50%;
    padding:12px 20px;
    border:2px solid var(--neon);
    color:var(--neon);
    text-shadow:0 0 12px var(--neon);
    cursor:pointer; z-index:1001;
  }
  .viewer-nav.prev { left:16px; }
  .viewer-nav.next { right:16px; }

  /* Bottone CHIUDI */
  .viewer-close {
    position: absolute;
    bottom:22px; left:50%; transform:translateX(-50%);
    font-size:17px; font-weight:700;
    background:var(--neon); color:#000;
    padding:8px 24px; border-radius:10px;
    border:2px solid var(--neon);
    box-shadow:0 0 20px var(--neon);
    text-transform:uppercase;
  }
</style>
</head>

<body>

<header>
  <a class="back" href="/Video-bpfam/">⬅️ Indietro</a>
  <h1 class="title">⭐ BPFAM RECENSIONI ⭐</h1>
</header>

<div class="wrap">
  <div id="grid" class="grid" data-cols="2"></div>
</div>

<footer>💎 Serietà, Qualità e Rispetto — BPFAM</footer>

<div class="fab" id="fab">
  <div class="fab-menu" id="fabMenu">
    <button class="fab-btn" data-c="1">1</button>
    <button class="fab-btn" data-c="2">2</button>
    <button class="fab-btn" data-c="3">3</button>
    <button class="fab-btn" data-c="4">4</button>
  </div>
  <button class="fab-toggle" id="fabToggle">⧉</button>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <span class="viewer-nav prev" id="viewerPrev">❮</span>
  <img id="viewerImg" class="viewer-img" src="">
  <span class="viewer-nav next" id="viewerNext">❯</span>
  <button class="viewer-close" id="viewerClose">CHIUDI</button>
</div>

<script>
(async()=>{
  const owner="bpfam", repo="Video-bpfam", path="recensioni";
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const grid=document.getElementById("grid");

  const saved=localStorage.getItem("bpfam_cols_rec")||"2";
  grid.setAttribute("data-cols",saved);

  const fab=document.getElementById("fab");
  const toggle=document.getElementById("fabToggle");
  const menu=document.getElementById("fabMenu");
  const btns=menu.querySelectorAll(".fab-btn");
  function setCols(c){
    grid.setAttribute("data-cols",c);
    localStorage.setItem("bpfam_cols_rec",c);
    btns.forEach(b=>b.classList.toggle("active",b.dataset.c===c));
  }
  setCols(saved);
  toggle.onclick=()=>fab.classList.toggle("open");
  document.onclick=e=>{if(!fab.contains(e.target))fab.classList.remove("open");};
  btns.forEach(b=>b.onclick=()=>{setCols(b.dataset.c);fab.classList.remove("open");});

  const VIDEO_RE=/\.(mp4|mov|webm|m4v)$/i;
  const IMG_RE=/\.(jpe?g|png|gif|webp)$/i;
  let imageList=[], current=0;

  const res=await fetch(api), files=await res.json();
  for(const f of files){
    if(!f.download_url)continue;
    const card=document.createElement("div");
    card.className="card";
    if(IMG_RE.test(f.name)){
      const i=imageList.length;
      const img=document.createElement("img");
      img.src=f.download_url; img.dataset.idx=i;
      imageList.push(f.download_url);
      card.appendChild(img);
    }else if(VIDEO_RE.test(f.name)){
      const v=document.createElement("video");
      v.controls=true; v.src=f.download_url;
      card.appendChild(v);
    }else continue;
    const name=document.createElement("div");
    name.className="name"; name.textContent=f.name;
    card.appendChild(name);
    grid.appendChild(card);
    requestAnimationFrame(()=>card.classList.add("show"));
  }

  const viewer=document.getElementById("viewer");
  const viewerImg=document.getElementById("viewerImg");
  const closeBtn=document.getElementById("viewerClose");
  const prev=document.getElementById("viewerPrev");
  const next=document.getElementById("viewerNext");

  function open(i){
    if(!imageList.length)return;
    current=(i+imageList.length)%imageList.length;
    viewerImg.src=imageList[current];
    viewer.classList.add("show");
    viewerImg.style.transform="scale(1)";
  }
  function close(){ viewer.classList.remove("show"); }
  function showNext(){ open(current+1); }
  function showPrev(){ open(current-1); }

  grid.onclick=e=>{
    const img=e.target.closest("img");
    if(!img)return;
    open(parseInt(img.dataset.idx,10));
  };
  prev.onclick=e=>{e.stopPropagation();showPrev()};
  next.onclick=e=>{e.stopPropagation();showNext()};
  closeBtn.onclick=close;

  let startX=null, scale=1, pinch=null;

  viewer.addEventListener("touchstart",e=>{
    if(e.touches.length===1){
      startX=e.touches[0].clientX;
    }else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      pinch=Math.hypot(dx,dy);
    }
  },{passive:false});

  viewer.addEventListener("touchmove",e=>{
    if(e.touches.length===2&&pinch){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      let dist=Math.hypot(dx,dy);
      scale=Math.min(3,Math.max(1,(dist/pinch)));
      viewerImg.style.transform=`scale(${scale})`;
    }
  },{passive:false});

  viewer.addEventListener("touchend",e=>{
    if(startX!==null&&e.changedTouches){
      const dx=e.changedTouches[0].clientX-startX;
      if(scale===1){
        if(dx>50)showPrev();
        if(dx<-50)showNext();
      }
    }
    startX=null; pinch=null;
  });

  document.oncontextmenu=e=>e.preventDefault();
})();
</script>

</body>
</html>
