<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPFAM RECENSIONI</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
  }

  h1 {
    margin-top: 30px;
    font-size: 28px;
    letter-spacing: 2px;
  }

  .back-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 12px 25px;
    border-radius: 10px;
    text-decoration: none;
    color: #00eaff;
    border: 2px solid #00eaff;
    text-shadow: 0 0 10px #00eaff;
    box-shadow: 0 0 15px #00eaff;
    font-weight: bold;
    font-size: 18px;
    transition: 0.25s;
  }

  .back-btn:hover {
    background: #00eaff;
    color: #000;
    box-shadow: 0 0 25px #00eaff;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 90%;
    margin: 40px auto 50px;
  }

  video, img {
    width: 100%;
    border-radius: 12px;
    border: 2px solid #00eaff;
    box-shadow: 0 0 15px #00eaff;
  }
</style>
</head>
<body>

<h1>⭐ BPFAM RECENSIONI ⭐</h1>

<!-- 🔙 TORNA ALLA HOME DI VIDEO-BPFAM -->
<a class="back-btn" href="/Video-bpfam/">🔙 Torna indietro</a>

<!-- NIENTE TESTO "carica un video/immagine..." -->

<div class="grid" id="contenitore"></div>

<script>
const owner = "bpfam";
const repo = "Video-bpfam";
const path = "recensioni";

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
  .then(r => r.json())
  .then(files => {
    const box = document.getElementById("contenitore");

    files.forEach(file => {
      let ext = file.name.split('.').pop().toLowerCase();

      // VIDEO
      if (["mp4","mov","webm"].includes(ext)) {
        box.innerHTML += `
          <video controls>
            <source src="${file.download_url}">
          </video>`;
      }

      // FOTO
      if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
        box.innerHTML += `
          <img src="${file.download_url}">
        `;
      }
    });
  });
</script>

</body>
</html>
